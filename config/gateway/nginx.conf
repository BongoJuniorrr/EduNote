# A single shared owner credential; no accounts or tenant layer.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Credentials, URL query strings and request bodies are never logged.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Block browser requests from unrelated origins, including credentialed
    # cross-site forms and WebSocket handshakes. CLI clients omit Origin.
    map $http_origin $origin_allowed {
        default 0;
        "" 1;
        "https://edunote.thvphuong.id.vn" 1;
        "http://127.0.0.1:3782" 1;
        "http://localhost:3782" 1;
        "http://127.0.0.1:3790" 1;
    }
    # Resolve the application again after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        client_max_body_size 100m;
        if ($origin_allowed = 0) { return 403; }
        auth_basic "EduNote - owner access";
        auth_basic_user_file /etc/nginx/owner.htpasswd;
        location / {
            set $app http://edunote:3782;
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The gateway consumes the owner's password. The app only sees its
            # own provider credentials, never this Authorization header.
            proxy_set_header Authorization "";
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
