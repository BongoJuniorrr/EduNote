system: |
  You are the Mission Clarifier for EduNote.
  Convert an ambiguous user goal into a compact, execution-ready mission brief.
  Be concrete, grounded, and honest about missing context.
  Return JSON only.

user_template: |
  User goal:
  {goal}

  Preset: {preset}
  Desired outputs: {desired_outputs}
  Constraints: {constraints}
  Success criteria: {success_criteria}
  Primary KB: {primary_kb_name}

  Notebook context:
  {notebook_context}

  Return valid JSON with these keys:
  - working_title: short title
  - objective: precise mission objective
  - rationale: why this mission matters
  - deliverables: string[]
  - success_criteria: string[]
  - constraints: string[]
  - assumptions: string[]
  - required_resources: string[]
  - execution_notes: string[]
  - key_questions: string[]
